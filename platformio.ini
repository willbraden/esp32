; PlatformIO configuration for the pebl weather display
; (ESP32-S3-WROOM-1, 4 MB flash, 2.13" SSD1680 e-ink panel).
;
; pebl_weather is the product. pebl_weather_staging is the same firmware on a
; fast cycle with a local OTA server. The rest are standalone diagnostics.
; Each env compiles only its own folder under src/ via build_src_filter.

[platformio]
default_envs = pebl_weather

; Shared by every env: this board, this partition table, this platform.
[env]
; pioarduino community platform (arduino-esp32 3.3.11 / IDF 5.5.5). Needs
; PlatformIO Core >= 6.1.19; 55.03.312 and later need >= 6.2.0.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
; This pebl board has a 4MB flash chip (devkitc-1 profile defaults to 8MB,
; which writes a bad flash-size header and aborts at boot).
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
; Two OTA app slots. Changing this table needs a USB flash of every device.
board_build.partitions = partitions.csv
; Mozilla CA roots for HTTPS certificate validation (see src/weather/ca_bundle.h)
board_build.embed_files = certs/x509_crt_bundle.bin
monitor_speed = 115200
upload_speed = 115200

; The weather display. See src/weather/weather_main.cpp.
[env:pebl_weather]
build_src_filter = -<*> +<weather/>
; FW_VERSION for OTA comes from the weather-v* git tag (or PEBL_FW_VERSION in CI)
extra_scripts = pre:scripts/weather_version.py
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    ; TLS handshake (mbedTLS) needs more than the default 8KB loop-task stack
    -D ARDUINO_LOOP_STACK_SIZE=16384
    ; Fixed location for the weather (Denver 80230). Remove both to locate by IP.
    -D HOME_LAT=39.7187
    -D HOME_LON=-104.8949
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    adafruit/Adafruit GFX Library@^1.11.9
    tzapu/WiFiManager@^2.0.17
    zinggjm/GxEPD2@^1.5.3
upload_port = /dev/cu.usbmodem101
monitor_port = /dev/cu.usbmodem101

; Staging build of the weather firmware: same code, but it wakes every minute,
; checks for updates on every wake, and reads its OTA manifest from a local
; server (python -m http.server on the Mac) instead of the GitHub stable channel.
; Set PEBL_OTA_STAGING_URL to override the URL, e.g. http://10.0.0.12:8765/manifest.json
[env:pebl_weather_staging]
extends = env:pebl_weather
build_flags =
    ${env:pebl_weather.build_flags}
    -D REFRESH_MINUTES=1
    -D OTA_CHECK_EVERY_N_WAKES=1
    '-D OTA_CHANNEL_URL="${sysenv.PEBL_OTA_STAGING_URL}"'

; OTA fault-injection build, for proving the trial-boot retry and rollback paths
; on the staging rig. Like staging (1-minute wakes, local manifest), but checks
; for updates every 3rd wake so rollback spacing is visible, and forces the
; first PEBL_FAULT_WIFI_FAILS WiFi attempts of an OTA trial boot to fail
; (0 = no fault). Never ship this.
[env:pebl_weather_fault]
extends = env:pebl_weather
build_flags =
    ${env:pebl_weather.build_flags}
    -D REFRESH_MINUTES=1
    -D OTA_CHECK_EVERY_N_WAKES=3
    '-D OTA_CHANNEL_URL="${sysenv.PEBL_OTA_STAGING_URL}"'
    -D FAULT_TRIAL_WIFI_FAILS=${sysenv.PEBL_FAULT_WIFI_FAILS}

; ============================================================================
; DIAGNOSTICS (standalone, flash over the weather firmware and back)
; ============================================================================

; Battery-sense probe. See src/battprobe/battprobe.cpp.
[env:pebl_battprobe]
build_src_filter = -<*> +<battprobe/>
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    zinggjm/GxEPD2@^1.5.3

; Button probe. See src/btnprobe/btnprobe.cpp.
[env:pebl_btnprobe]
build_src_filter = -<*> +<btnprobe/>
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

; Network stress test. See src/netstress/netstress.cpp.
; Same flags as pebl_weather so the network stack behaves identically.
[env:pebl_netstress]
build_src_filter = -<*> +<netstress/>
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_LOOP_STACK_SIZE=16384

; OTA rollback test image: never confirms itself, then reboots, so the
; bootloader must roll back to the previous weather firmware.
[env:pebl_otafail]
build_src_filter = -<*> +<otafail/>
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
